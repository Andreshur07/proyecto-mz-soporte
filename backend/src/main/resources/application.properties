spring.application.name=soporte
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soporte_colaborativo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:c2lzdGVtYS1zb3BvcnRlLWRlc2Fycm9sbG8tY2xhdmUtand0LTIwMjYtMzItYnl0ZXM=}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
app.dev-seed.enabled=${DEV_SEED_ENABLED:true}
